name: Majsoul-Login

on:
  workflow_dispatch:
  schedule: # 05:13 CST
    - cron: '13 21 * * *'

permissions:
  contents: write

jobs:
  login:
    name: Majsoul-Login
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Selenium
        run: pip install selenium==4.17.2

      - name: Majsoul login
        run: python login.py ${{ secrets.EMAIL }} ${{ secrets.PASSWD }}

      - name: Keep scheduled workflow active
        if: ${{ always() && github.repository == 'AullChen/majsoul-auto-login' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail

          KEEPALIVE_FILE=".github/keepalive.log"
          INTERVAL_SECONDS=$((30 * 24 * 60 * 60))
          NOW=$(date -u +%s)
          LAST_COMMIT=$(git log -1 --format=%ct -- "$KEEPALIVE_FILE" || true)

          if [ -n "$LAST_COMMIT" ] && [ $((NOW - LAST_COMMIT)) -lt "$INTERVAL_SECONDS" ]; then
            echo "Keepalive is not due yet."
            exit 0
          fi

          printf '%s - keepalive\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$KEEPALIVE_FILE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$KEEPALIVE_FILE"
          git commit -m "chore(keepalive): refresh scheduled workflow"
          git push origin HEAD:main
